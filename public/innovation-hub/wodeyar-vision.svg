<?xml version="1.0" encoding="UTF-8"?>
<!-- Wodeyar vision motif: planning table with public institutions rising from a blueprint.
     Symbolic only. No portraits, no faces. Use stroke="currentColor" for consumer-driven colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Outer frame (manuscript / decree) -->
  <rect x="20" y="20" width="560" height="360" rx="6" stroke-width="1.2" opacity="0.7"/>
  <rect x="36" y="36" width="528" height="328" rx="4" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Throne arch silhouette (regal, no face) -->
  <g transform="translate(300 80)">
    <path d="M -60 110 V 40 Q -60 0 0 -20 Q 60 0 60 40 V 110 Z" stroke-width="1.4"/>
    <path d="M -40 110 V 50 Q -40 14 0 0 Q 40 14 40 50 V 110" opacity="0.6"/>
    <!-- Crown spires (3 small) -->
    <path d="M -22 -8 L -16 -22 L -10 -8"/>
    <path d="M -6 -16 L 0 -32 L 6 -16"/>
    <path d="M 10 -8 L 16 -22 L 22 -8"/>
    <circle cx="0" cy="-32" r="2" fill="currentColor"/>
    <!-- Throne seat line -->
    <line x1="-60" y1="80" x2="60" y2="80"/>
    <line x1="-60" y1="110" x2="60" y2="110"/>
  </g>

  <!-- Three public institutions rising below the throne (assembly hall, university, hydro tower) -->
  <g transform="translate(80 250)">
    <!-- Assembly hall (1881) -->
    <rect x="0" y="40" width="100" height="80" stroke-width="1.4"/>
    <path d="M 0 40 L 50 10 L 100 40"/>
    <line x1="50" y1="10" x2="50" y2="-2"/>
    <circle cx="50" cy="-4" r="2" fill="currentColor"/>
    <line x1="14" y1="50" x2="14" y2="115"/>
    <line x1="32" y1="50" x2="32" y2="115"/>
    <line x1="68" y1="50" x2="68" y2="115"/>
    <line x1="86" y1="50" x2="86" y2="115"/>
    <rect x="42" y="80" width="16" height="40" stroke-width="1"/>
    <text x="50" y="138" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="currentColor" stroke="none" opacity="0.7">1881</text>
  </g>

  <g transform="translate(245 240)">
    <!-- University columns (1916) -->
    <rect x="0" y="40" width="110" height="90" stroke-width="1.4"/>
    <path d="M -8 40 L 55 10 L 118 40" stroke-width="1.4"/>
    <line x1="55" y1="10" x2="55" y2="-4"/>
    <circle cx="55" cy="-6" r="2" fill="currentColor"/>
    <line x1="16" y1="44" x2="16" y2="124"/>
    <line x1="36" y1="44" x2="36" y2="124"/>
    <line x1="56" y1="44" x2="56" y2="124"/>
    <line x1="76" y1="44" x2="76" y2="124"/>
    <line x1="96" y1="44" x2="96" y2="124"/>
    <path d="M 18 44 Q 18 36 26 36 Q 36 36 36 44" stroke-width="0.8" opacity="0.7"/>
    <path d="M 38 44 Q 38 36 46 36 Q 56 36 56 44" stroke-width="0.8" opacity="0.7"/>
    <path d="M 58 44 Q 58 36 66 36 Q 76 36 76 44" stroke-width="0.8" opacity="0.7"/>
    <path d="M 78 44 Q 78 36 86 36 Q 96 36 96 44" stroke-width="0.8" opacity="0.7"/>
    <text x="55" y="148" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="currentColor" stroke="none" opacity="0.7">1916</text>
  </g>

  <g transform="translate(420 250)">
    <!-- Hydroelectric tower (1902 — first Indian state to generate hydro) -->
    <path d="M 20 120 L 0 120 L 22 40 L 42 40 L 64 120 L 44 120"/>
    <line x1="22" y1="40" x2="42" y2="40"/>
    <path d="M 18 60 L 46 60 M 16 80 L 48 80 M 14 100 L 50 100" stroke-width="0.8" opacity="0.6"/>
    <!-- Power burst -->
    <g transform="translate(32 28)" stroke-width="1.2">
      <line x1="0" y1="-12" x2="0" y2="-22"/>
      <line x1="-8" y1="-8" x2="-14" y2="-16"/>
      <line x1="8" y1="-8" x2="14" y2="-16"/>
      <circle cx="0" cy="-4" r="3" fill="currentColor" stroke="none"/>
    </g>
    <text x="32" y="138" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="currentColor" stroke="none" opacity="0.7">1902</text>
  </g>

  <!-- Connecting ground line -->
  <line x1="60" y1="380" x2="540" y2="380" stroke-width="1"/>
  <line x1="60" y1="386" x2="540" y2="386" stroke-width="0.6" opacity="0.5"/>
</svg>
